name: Build Debian Bookworm Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Branch or tag'
        required: true
        default: 'dev/adreno-main'
      draft_release:
        description: 'Draft a new release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  debian-bookworm:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
      options: --privileged --user root

    steps:
      - name: Install dependencies
        run: |
          echo 'deb http://deb.debian.org/debian bookworm-backports main' > /etc/apt/sources.list.d/backports.list
          apt update
          apt install -y --no-install-recommends ca-certificates curl git ccache build-essential pkg-config \
            ninja-build bison flex python3-mako python3-yaml \
            libdrm-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libx11-xcb-dev libxcb-dri3-dev libxcb-shm0-dev libxcb-sync-dev \
            libxcb-present-dev libxcb-glx0-dev libxshmfence-dev libxext-dev \
            libxdamage-dev libxfixes-dev libxrandr-dev libxxf86vm-dev \
            libglvnd-dev libgl-dev libegl-dev libgles-dev libglx-dev libopengl-dev \
            libvulkan-dev cmake \
            libx11-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-render0-dev libxrender-dev libgbm-dev \
            llvm-14-dev libclang-14-dev libclc-14 libarchive-dev zlib1g-dev \
            libexpat1-dev libzstd-dev libsensors-dev libudev-dev libelf-dev \
            libva-dev libvdpau-dev \
            python3-ply python3-numpy libxml2-dev
          apt install -y -t bookworm-backports meson
          meson --version
          /usr/lib/llvm-14/bin/llvm-config --version

      - name: Build glslang (build-time tool, source-built for bookworm glibc)
        run: |
          cd /tmp
          curl -sSL -o glslang.tar.gz https://github.com/KhronosGroup/glslang/archive/refs/tags/12.2.0.tar.gz
          tar xf glslang.tar.gz
          cd glslang-12.2.0
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DENABLE_OPT=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build -j$(nproc)
          cmake --install build
          rm -rf /tmp/glslang-12.2.0 /tmp/glslang.tar.gz
          which -a glslangValidator
          glslangValidator --version | head -3

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-bookworm-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-bookworm-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --zero-stats
          ccache --show-stats

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set release name suffix
        shell: bash
        env:
          SOURCE_REF: ${{ github.event.inputs.tag }}
        run: |
          cd "$GITHUB_WORKSPACE"
          version=$(grep -v '^[[:space:]]*$' VERSION | head -n1)
          build_date=$(TZ=Asia/Shanghai date +%Y%m%d)
          source_ref="${SOURCE_REF#refs/tags/}"
          if [[ "$source_ref" =~ ^(mesa|turnip)-.*-devel-([0-9]{8}(-r[0-9]+)?)$ ]]; then
            build_date="${BASH_REMATCH[2]}"
          fi
          echo "MESA_RELEASE_NAME_SUFFIX=${version}-${build_date}_debian_bookworm_arm64" >> "$GITHUB_ENV"
          echo "Using suffix: ${version}-${build_date}_debian_bookworm_arm64"

      - name: Build Mesa
        shell: bash
        run: |
          export CCACHE_DIR=/root/.ccache
          cd "$GITHUB_WORKSPACE"
          export PATH="/usr/lib/llvm-14/bin:$PATH"
          meson setup build/ \
            --prefix=/usr \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers=freedreno,zink,virgl,llvmpipe \
            -Dgallium-va=enabled \
            -Dtermux-va-bridge=enabled \
            -Dtermux-va-wayland-shim=enabled \
            -Dvideo-codecs=all \
            -Dgallium-mediafoundation=disabled \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-layers= \
            -Degl=enabled \
            -Dgles2=enabled \
            -Dglvnd=enabled \
            -Dglx=dri \
            -Dlibunwind=disabled \
            -Dintel-rt=disabled \
            -Dmicrosoft-clc=disabled \
            -Dvalgrind=disabled \
            -Dgles1=disabled \
            -Dfreedreno-kmds=kgsl \
            -Dbuildtype=release
          ninja -C build/
          echo "Mesa build completed successfully!"

      - name: Save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-bookworm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package Mesa
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p /tmp/mesa-install-tmp
          DESTDIR=/tmp/mesa-install-tmp meson install -C build/
          tar -zcvf mesa-for-android-container_${MESA_RELEASE_NAME_SUFFIX}.tar.gz -C /tmp/mesa-install-tmp .
          rm -rf /tmp/mesa-install-tmp
          find . -maxdepth 1 -name "*.tar.gz" -type f -printf "%P\0" | xargs -0 sha256sum | sort -k2 > sha256sums.txt
          cat sha256sums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mesa-for-android-container_${{ env.MESA_RELEASE_NAME_SUFFIX }}
          path: |
            *.tar.gz
            sha256sums.txt
          retention-days: 90
